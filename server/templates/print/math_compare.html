{{define "pagecss"}}<style>@page { size: {{.Meta.Paper}}; margin: 15mm; }</style>{{end}}

{{define "content"}}
{{if .Items}}
<div class="note">比较大小的题在○里填 &gt;、&lt; 或 =；找规律的题把下一个数写在横线上。</div>
<div class="drill cols-{{.Options.Columns}}">
    {{range .Items}}
    <div class="q">
        <span class="q-no">{{.Seq}}.</span><span class="q-prompt" style="font-size:{{$.Options.FontSize}}pt">{{.Main}}</span>
    </div>
    {{end}}
</div>
{{else}}
<div class="empty-hint">没有生成题目</div>
{{end}}

{{if .Options.WithAnswer}}
{{if .AnswerItems}}
<section class="answer-section">
    <div class="section-title">参考答案</div>
    <div class="drill cols-4">
        {{range .AnswerItems}}
        <div class="q"><span class="q-no">{{.Seq}}.</span><span style="font-size:{{$.Options.FontSize}}pt">{{.Answer}}</span></div>
        {{end}}
    </div>
</section>
{{end}}
{{end}}
{{end}}
